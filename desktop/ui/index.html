<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Numina</title>
    <style>
      /* Shown only for the moment between window open and the local server
         answering. Everything here is local — no fonts, scripts, or images
         are fetched. */
      :root {
        color-scheme: dark light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #e7e7ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main {
        text-align: center;
      }
      .dot {
        width: 34px;
        height: 34px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 3px solid rgba(231, 231, 234, 0.2);
        border-top-color: #e7e7ea;
        animation: spin 0.9s linear infinite;
      }
      p {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.02em;
        opacity: 0.7;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <p>Starting Numina&hellip;</p>
    </main>
  </body>
</html>
