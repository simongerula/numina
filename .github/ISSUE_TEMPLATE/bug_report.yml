name: Bug report
description: Something broke or behaves unexpectedly. Please keep your financial data private.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        :lock: **Privacy first** — Numina stores your real financial data in
        `data/` (`numina.db`, `*.db-wal`, `*.db-shm`). **Never attach, paste,
        or link that file, and never post screenshots with real balances.**
        Mask every amount and account name before including any image or
        output. A bug report containing real financial data may be deleted.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the ledger
        2. Edit a row's type to 'withdraw' without changing the amount
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Numina version
      description: From package.json, or the release you downloaded.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version — e.g. "macOS 15, Node 22.15, pnpm 11.1.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output / errors
      description: Terminal output from `numina` or `pnpm dev`, if any. Mask anything identifying.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real financial data (no `data/` files, masked screenshots)
          required: true
